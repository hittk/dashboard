next_action:
  title: Merge the working branch, then start the simulated run the gates measure
  due: 2026-08-03

blocked_on_me:
  - title: Six phases of work sit on a branch that was never merged
    decision: Merge it, or deliberately keep it isolated until there is a record
    since: 2026-07-27
  - title: The record the gates require cannot start accumulating until the run is switched on
    decision: Start the simulated run now, or keep building first
    since: 2026-07-27

risks:
  - title: The build is finished; the evidence behind it is not
    severity: high
    mitigation: Eight weeks and twenty closed positions are the floor. Do not shorten them because the code looks done.
  - title: Tuning was done on one window with no true out-of-sample period
    severity: high
    mitigation: Treat the simulated run as the actual out-of-sample test, not a formality before switching over.
  - title: Nothing has been merged, so the default branch does not reflect the project
    severity: medium
    mitigation: Merge, or write down why not — an unmerged branch is a single point of loss.

log:
