# Copy to projects/<id>.yml and fill in. Files starting with _ are ignored by the build.
# Full field reference: schema/project.schema.md
#
# PUBLIC REPO. Codenames and outcomes only — no client names, people, paths, code or
# figures. Read PRIVACY.md first.

id: my-project            # must match the filename stem: projects/my-project.yml
codename: My Project      # a codename, not the real client or product name
summary: One generic sentence describing what this project is for.
status: green             # green | amber | red | paused | done
stage: discovery          # discovery | build | review | shipped
started: 2026-01-01
target: 2026-06-30        # optional — omit if genuinely open-ended
updated: 2026-01-01       # bump this whenever you review the file

# The plan you're tracked against. Chunky milestones — five to eight, not thirty.
plan:
  - id: m1
    title: First milestone
    status: todo          # done | in_progress | todo | blocked
    due: 2026-02-15

# The single next concrete step. If you can't name one, that's the signal.
next_action:
  title: The next thing to actually do
  due: 2026-01-15

# Things only you can unblock. Sorted oldest-first at the top of the dashboard.
blocked_on_me:
  - title: What is stuck
    decision: What you actually have to choose between
    since: 2026-01-05

# Parked on someone or something external. `who` is a role, never a name.
waiting_on:
  - title: What you're waiting for
    who: external — supplier
    since: 2026-01-03
    chase_after: 2026-01-17   # optional — flagged for chasing past this date

risks:
  - title: What could derail this
    severity: medium        # high | medium | low
    mitigation: What would recover it

links:
  - label: Public page
    url: https://example.com

# Newest first, ≤10 entries. Outcomes, not commit messages.
log:
  - date: 2026-01-01
    note: Project started.
